name: Deploy to Server

on:
  push:
    branches: [main, master]

concurrency:
  group: qafaseman-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup SSH Directory & Host Keys
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H -t rsa,ed25519 ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Configure SSH Private Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: SSH Connectivity Check (Fail-Fast 30s)
        timeout-minutes: 1
        run: |
          echo "🔍 تست اتصال SSH به سرور..."
          timeout 30s ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o ServerAliveInterval=5 root@${{ secrets.SERVER_HOST }} 'echo "Connection successful"'
          if [ $? -eq 0 ]; then
            echo "✅ اتصال SSH با موفقیت برقرار شد."
          else
            echo "❌ خطا: عدم امکان برقراری ارتباط SSH در زمان ۳۰ ثانیه."
            exit 1
          fi

      - name: Build local packages
        run: |
          set -e
          if [ -d "packages/iranketab-extractor" ]; then
            cd packages/iranketab-extractor && npm install && npm run build && cd ../..
          fi

      - name: Install dependencies
        run: |
          set -e
          npm install --force

      - name: Create .env.local
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env.local
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env.local
          echo "APP_URL=${{ secrets.APP_URL }}" >> .env.local
          echo "NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}" >> .env.local
          echo "UPLOAD_DRIVER=${{ secrets.UPLOAD_DRIVER }}" >> .env.local
          echo "UPLOAD_LOCAL_FALLBACK=${{ secrets.UPLOAD_LOCAL_FALLBACK }}" >> .env.local
          echo "UPLOAD_MAX_FILE_KB=${{ secrets.UPLOAD_MAX_FILE_KB }}" >> .env.local
          echo "S3_ENDPOINT=${{ secrets.S3_ENDPOINT }}" >> .env.local
          echo "S3_REGION=${{ secrets.S3_REGION }}" >> .env.local
          echo "S3_BUCKET=${{ secrets.S3_BUCKET }}" >> .env.local
          echo "S3_ACCESS_KEY_ID=${{ secrets.S3_ACCESS_KEY_ID }}" >> .env.local
          echo "S3_SECRET_ACCESS_KEY=${{ secrets.S3_SECRET_ACCESS_KEY }}" >> .env.local
          echo "S3_PUBLIC_BASE_URL=${{ secrets.S3_PUBLIC_BASE_URL }}" >> .env.local
          echo "ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}" >> .env.local
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env.local
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env.local
          echo "GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}" >> .env.local

      - name: Build Next.js app (Standalone Mode)
        run: |
          set -e
          npm run build
          if [ ! -d ".next/standalone" ]; then
             echo "❌ خطا: پوشه .next/standalone ساخته نشده است. مطمئن شوید در next.config.js مقدار output: 'standalone' تنظیم شده باشد."
             exit 1
          fi

      - name: Prepare Standalone Package (Ultra-lightweight)
        run: |
          set -e
          echo "📦 آماده‌سازی پکیج فوق‌سبک Standalone..."

          # کپی فایل‌های استاتیک به داخل standalone
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/

          # کپی پوشه public (اگر وجود داشته باشد)
          if [ -d "public" ]; then cp -r public .next/standalone/; fi

          # کپی فایل env
          cp .env.local .next/standalone/.env.local 2>/dev/null || true

          echo "🗜️ فشرده‌سازی پکیج Standalone..."
          tar -czf standalone.tar.gz -C .next/standalone .

          echo "📊 حجم پکیج آماده ارسال:"
          ls -lh standalone.tar.gz

      - name: Upload Standalone Archive via Rsync (Fast Transfer)
        timeout-minutes: 10
        run: |
          echo "📤 ارسال پکیج فوق‌سبک standalone.tar.gz به سرور..."
          # rsync خودش پوشه مقصد را می‌سازد و بسیار سریع است
          rsync -avz --progress -e "ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o ServerAliveInterval=15" standalone.tar.gz root@${{ secrets.SERVER_HOST }}:/opt/sites/qafaseman/

          if [ $? -eq 0 ]; then
            echo "✅ فایل بیلد فوق‌سبک با موفقیت آپلود شد."
          else
            echo "❌ خطا در آپلود پکیج به سرور!"
            exit 1
          fi

      - name: Upload remote deploy script
        run: |
          scp -O -o ConnectTimeout=10 -o StrictHostKeyChecking=no scripts/deploy-remote.sh root@${{ secrets.SERVER_HOST }}:/opt/sites/qafaseman/
          ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no root@${{ secrets.SERVER_HOST }} "chmod +x /opt/sites/qafaseman/deploy-remote.sh"

      - name: Execute remote deploy script via SSH
        timeout-minutes: 5
        run: |
          echo "🚀 اجرای اسکریپت دپلوی و شروع برنامه در سرور..."
          ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no root@${{ secrets.SERVER_HOST }} "bash /opt/sites/qafaseman/deploy-remote.sh"

      - name: Deployment Failure Alert
        if: failure()
        run: |
          echo "❌ فرآیند دپلوی با خطا مواجه شد. لطفاً لاگ‌های استپ قبلی را چک کنید."
